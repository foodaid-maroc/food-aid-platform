# Construit les images api et workers et les publie sur GitHub Container Registry (gratuit pour un dépôt public).
name: images

on:
  push:
    branches: [main]
    paths: ['azure/api/**', 'azure/workers/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, workers]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/foodaid-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: azure/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
