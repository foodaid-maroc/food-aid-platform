# Déploie le portail sur Azure Static Web Apps (après un terraform-apply).
# Prérequis : secret AZURE_STATIC_WEB_APPS_API_TOKEN + variable SWA_ENABLED=true.
name: portal-deploy

on:
  push:
    branches: [main]
    paths: ['azure/portal/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: vars.SWA_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: azure/portal
          output_location: dist
        env:
          VITE_AUTH_MODE: entra
          VITE_ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          VITE_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
          VITE_API_BASE: ${{ vars.API_URL }}
